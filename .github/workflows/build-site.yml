name: Build site outputs

on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'data/**'
      - 'templates/**'
      - 'scripts/build.mjs'
      - 'scripts/lib.mjs'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/build-site.yml'

permissions:
  contents: write

concurrency:
  group: build-site-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run tests
        run: npm test

      - name: Build preview and production outputs
        run: |
          npm run build:preview
          npm run build:production

      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html dist
          if git diff --cached --quiet; then
            echo "No generated output changes"
            exit 0
          fi
          git commit -m "Build site outputs"
          git pull --rebase origin main
          git push origin HEAD:main
